name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: cross-compile build
        run: make all
