name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: crate-agent

      - name: Check out private-mesh dependency
        uses: actions/checkout@v5
        with:
          repository: NakliTechie/private-mesh
          path: private-mesh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: crate-agent/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: crate-agent

      - name: go test
        run: go test ./...
        working-directory: crate-agent

      - name: cross-compile build
        run: make all
        working-directory: crate-agent
