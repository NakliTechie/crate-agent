# Sample crate-agent.toml — see docs/config-reference.md for the schema.
#
# Real configs are generated by `crate-agent pair` (M2). This sample is
# here for documentation + the M1 smoke test. Do NOT commit a real
# pairing_token or bucket_id from a production paired daemon.

[agent]
log_level = "info"
log_path  = "~/.local/share/nakli/crate-agent.log"
state_db  = "~/.local/share/nakli/crate-agent.db"

[identity]
path = "~/.config/nakli/identity.key"

[crate]
name               = "personal"
local_path         = "~/crate"
transport_endpoint = "http://127.0.0.1:7842"
transport_type     = "hub"
pairing_token      = "REDACTED"
bucket_id          = "01HZZZZZZZZZZZZZZZZZZZZZZZ"
encrypt_at_rest    = false
